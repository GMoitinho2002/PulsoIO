<div class="admin-shell">
  <aside>
    <div class="sidebar-heading">
      <a class="brand" routerLink="/" aria-label="Pulso I/O — início">
        <img class="brand-symbol" src="assets/brand/pulso-io-symbol.png" alt="">
        <img class="brand-wordmark" src="assets/brand/pulso-io-wordmark.png" alt="Pulso I/O">
      </a>
      <span class="admin-label">Administração</span>
    </div>

    <nav aria-label="Navegação administrativa">
      <p>Workspace</p>
      <a routerLink="/app" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" /></svg>
        <span>Visão geral</span>
      </a>
      @if (isAdmin()) {
        <a routerLink="/app/users" routerLinkActive="is-active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM8 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 0c-2.67 0-8 1.34-8 4v2h12v-2c0-1.2-1.08-2.12-2.47-2.77C18.9 14.63 20 15.55 20 17v2h4v-2c0-2.66-5.33-4-8-4ZM8 15c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z" /></svg>
          <span>Usuários</span>
        </a>
        <a routerLink="/app/clients" routerLinkActive="is-active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4h2a2 2 0 0 1 2 2v10h-2v-2h-2v2h-2V5H6v16H4Zm4-12h2V7H8v2Zm4 0h2V7h-2v2Zm-4 4h2v-2H8v2Zm4 0h2v-2h-2v2Zm-4 4h2v-2H8v2Zm4 0h2v-2h-2v2Zm4-2h2v-2h-2v2Z" /></svg>
          <span>Clientes</span>
        </a>
      }
      <a routerLink="/app/settings" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.8 7.8 0 0 0 .05-1l-.05-1 2.12-1.65-2-3.46-2.49 1a7.6 7.6 0 0 0-1.73-1L15 3.24h-4L10.7 5.9a7.6 7.6 0 0 0-1.73 1l-2.49-1-2 3.46L6.6 11a7.8 7.8 0 0 0-.05 1l.05 1-2.12 1.65 2 3.46 2.49-1a7.6 7.6 0 0 0 1.73 1l.3 2.65h4l.3-2.65a7.6 7.6 0 0 0 1.73-1l2.49 1 2-3.46L19.4 13ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z" /></svg>
        <span>Configurações</span>
      </a>
    </nav>

  </aside>

  <section class="workspace">
    <header>
      <span><i></i>Ambiente local</span>
      <div #profileArea class="profile-area">
        <button
          #profileButton
          type="button"
          class="profile-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="profileMenuOpen()"
          (click)="toggleProfileMenu($event)">
          <span class="avatar" aria-hidden="true">@if (photoUrl()) { <img [src]="photoUrl()" alt=""> } @else { {{ initials() }} }</span>
          <span class="profile-copy"><strong>{{ user()?.name || 'Usuário' }}</strong><small>{{ user()?.isRoot ? 'Acesso global' : (user()?.clientName || 'Minha conta') }}</small></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5H7Z" /></svg>
        </button>
        @if (profileMenuOpen()) {
          <div class="profile-menu" role="menu" aria-label="Menu do perfil" (click)="$event.stopPropagation()">
            <div class="menu-identity"><strong>{{ user()?.name }}</strong><small>{{ user()?.email }}</small></div>
            <a #profileLink routerLink="/app/profile" role="menuitem" (click)="closeProfileMenu()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z" /></svg>
              Meu perfil
            </a>
            <button type="button" role="menuitem" (click)="logout()" [disabled]="signingOut()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5v3H3v4h7v3Zm9-14H8a2 2 0 0 0-2 2v3h2V5h11v14H8v-3H6v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z" /></svg>
              {{ signingOut() ? 'Saindo…' : 'Sair do sistema' }}
            </button>
          </div>
        }
      </div>
    </header>
    <main><router-outlet /></main>
  </section>
</div>
